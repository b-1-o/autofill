<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Autofill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">JOB APPLICATIONS</div>
        <h1>Autofill</h1>
      </div>
      <div class="mark">B1O</div>
    </header>

    <section class="profile-card">
      <div class="profile-name" id="profileName">Your profile</div>
      <div class="profile-email" id="profileEmail">Add your email in Edit Profile</div>
    </section>

    <button id="fillButton" class="fill-button">Fill Form</button>
    <div id="status" class="status" role="status">Ready.</div>

    <section class="documents">
      <div class="section-title">Documents</div>
      <div class="document-row">
        <div>
          <strong>Frontend CV</strong>
          <span>Erik_Ghabuzyan_Frontend_Developer_CV.pdf</span>
        </div>
        <button class="download" data-file="resume">Get</button>
      </div>
      <div class="document-row">
        <div>
          <strong>Cover Letter</strong>
          <span>Erik_Ghabuzyan_Cover_Letter.pdf</span>
        </div>
        <button class="download" data-file="cover">Get</button>
      </div>
      <div class="document-row">
        <div>
          <strong>Mindsize Cover</strong>
          <span>Erik_Ghabuzyan_Cover_Letter_Mindsize.pdf</span>
        </div>
        <button class="download" data-file="coverMindsize">Get</button>
      </div>
    </section>

    <button id="editProfile" class="edit-button">⚙ Edit Profile</button>

    <section id="profileEditor" class="profile-editor hidden">
      <div class="section-title">Profile</div>
      <div class="grid">
        <label>First name<input id="firstName"></label>
        <label>Last name<input id="lastName"></label>
        <label class="full">Email<input id="email" type="email"></label>
        <label>Phone<input id="phone"></label>
        <label class="full">Location<input id="location"></label>
        <label class="full">Company<input id="company"></label>
        <label class="full">LinkedIn<input id="linkedin"></label>
        <label class="full">GitHub<input id="github"></label>
        <label class="full">Portfolio<input id="portfolio"></label>
        <label>Authorized to work<input id="authorizedToWork"></label>
        <label>Requires sponsorship<input id="requiresSponsorship"></label>
      </div>
      <button id="saveProfile" class="save-button">Save Profile</button>
    </section>

    <footer>
      <span>Review answers before submitting.</span>
      <a href="https://github.com/b-1-o/autofill" target="_blank" rel="noreferrer">GitHub</a>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
