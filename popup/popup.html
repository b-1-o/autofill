<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autofill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">JOB APPLICATIONS</p>
        <h1>Autofill</h1>
      </div>
      <span class="badge">MV3</span>
    </header>

    <form id="profileForm" novalidate>
      <section class="card">
        <div class="section-heading">
          <h2>Profile</h2>
          <span class="hint">Saved with Chrome Sync</span>
        </div>

        <div class="grid">
          <label>First name<input id="firstName" name="firstName" autocomplete="given-name"></label>
          <label>Last name<input id="lastName" name="lastName" autocomplete="family-name"></label>
          <label class="full">Email<input id="email" name="email" type="email" autocomplete="email"></label>
          <label>Phone<input id="phone" name="phone" type="tel" autocomplete="tel"></label>
          <label>Location<input id="location" name="location" placeholder="City, State"></label>
          <label class="full">Company<input id="company" name="company"></label>
          <label class="full">LinkedIn<input id="linkedin" name="linkedin" type="url" placeholder="https://..."></label>
          <label class="full">GitHub<input id="github" name="github" type="url" placeholder="https://..."></label>
          <label class="full">Portfolio<input id="portfolio" name="portfolio" type="url" placeholder="https://..."></label>
          <label>Years of experience<input id="yearsOfExperience" name="yearsOfExperience" type="number" min="0" step="1"></label>
          <label>Authorized to work<select id="authorizedToWork" name="authorizedToWork"><option value="">Choose...</option><option value="Yes">Yes</option><option value="No">No</option></select></label>
          <label>Requires sponsorship<select id="requiresSponsorship" name="requiresSponsorship"><option value="">Choose...</option><option value="Yes">Yes</option><option value="No">No</option></select></label>
        </div>

        <div class="actions">
          <button id="saveButton" type="button" class="button secondary">Save</button>
          <button id="fillButton" type="button" class="button primary">Fill Form</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite">Ready.</p>
      </section>
    </form>

    <section class="card ai-card">
      <div>
        <h2>Cover Letter</h2>
        <p>AI generation will be connected later.</p>
      </div>
      <button id="coverLetterButton" type="button" class="button ghost">Generate with AI</button>
    </section>

    <footer>
      <span>Review before submitting.</span>
      <a href="https://github.com/b-1-o/autofill" target="_blank" rel="noreferrer">GitHub</a>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
